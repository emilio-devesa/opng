; Open Pastebin NG - production PHP/OPcache settings (PERF-07)
; ------------------------------------------------------------------
; Load this file from the PHP-FPM pool (php_admin_value) or copy the
; relevant values into php.ini, then restart PHP-FPM.
;
; OPcache compiles each PHP file once. validate_timestamps=0 is the
; fastest setting, but it means every deployment must restart PHP-FPM
; (or call opcache_reset()) so workers do not keep old code.

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1

; PHP resolves include/require paths on every request. A larger realpath
; cache avoids repeated stat calls for the application's many files.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Do not advertise the PHP version in response headers.
expose_php = Off

; Production must never render errors to visitors; log them instead.
display_errors = Off
log_errors = On

; The application accepts 1 MiB of paste text; form encoding expands it.
post_max_size = 4M
