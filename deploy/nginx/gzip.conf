# Open Pastebin NG - Nginx compression for versioned assets (PERF-07)
# ------------------------------------------------------------------
# Include this file inside the HTTPS server block:
#
#   include /etc/nginx/snippets/opng-gzip.conf;
#
# Assets are requested with ?v=<version> and the example server sends a
# long-lived Cache-Control for them, so compression saves bandwidth on the
# first load without adding per-request work for cached files.
#
# Brotli is optional. If the ngx_brotli module is installed, add:
#   brotli on;
#   brotli_comp_level 5;
#   brotli_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/xml
    image/svg+xml;
