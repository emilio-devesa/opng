# Open Pastebin NG - Nginx + PHP-FPM example
# ------------------------------------------------------------------
# Copia este bloque a /etc/nginx/sites-available/opng, enlázalo en
# sites-enabled y ajusta server_name, root y fastcgi_pass.
#
# IMPORTANTE: el docroot debe ser el contenido de `src/`, NO la raíz
# del repositorio. Así `tools/`, `README.md` y `.git/` quedan fuera
# del alcance de HTTP.
# ------------------------------------------------------------------

# HTTP is used only to redirect to the TLS virtual host.
server {
    listen 80;
    server_name pastebin.example.com;
    return 301 https://$host$request_uri;
}

# Configure a certificate before enabling this server block.
server {
    listen 443 ssl;
    server_name pastebin.example.com;

    ssl_certificate /etc/letsencrypt/live/pastebin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pastebin.example.com/privkey.pem;
    root /var/www/opng/src;
    index index.php;

    # Form-urlencoded content can expand when encoded; the application accepts
    # at most 1 MiB of paste text and independently enforces the byte limit.
    client_max_body_size 4m;

    # Ficheros que solo deben cargarse desde PHP.
    location ~ ^/(config\.php|config\.example\.php|database\.php|rules\.xml)$ {
        deny all;
        return 404;
    }

    # Directorio interno (require/include).
    location ^~ /includes/ {
        deny all;
        return 404;
    }

    # Ficheros ocultos (.git, .htaccess, ...).
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location = /install.php {
        return 404;
    }

    # El CAPTCHA no debe cachearse nunca.
    location = /auth/captcha.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        # add_header no se hereda si el location define el suyo: repetimos
        # las cabeceras de seguridad.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header Strict-Transport-Security "max-age=15768000" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Estáticos: caché larga (los assets no cambian de nombre).
    location ~* \.(css|js|png|jpe?g|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        # Igual que arriba: add_header corta la herencia.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header Strict-Transport-Security "max-age=15768000" always;
        try_files $uri =404;
    }

    # Cabeceras de seguridad (equivalentes a src/.htaccess).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    # Enable HSTS only after verifying that all site traffic uses valid TLS.
    add_header Strict-Transport-Security "max-age=15768000" always;

    # PHP2Shell (CVE-2026-109619 / CVE-2026-115560): desactivar
    # session.upload_progress a nivel de pool (no anulable con ini_set):
    #
    #   php_admin_flag[session.upload_progress.enabled] = off
    #
    # Reinicia los workers por completo (restart, no reload).
}
