; Open Pastebin NG - supervisord for the Apple Container image (F3).
; Runs as the container init process and supervises both long-lived services.

[supervisord]
nodaemon = true
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid
user = root

[unix_http_server]
file = /run/supervisor.sock
chmod = 0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///run/supervisor.sock

[program:php-fpm]
command = /usr/local/sbin/php-fpm --nodaemonize
priority = 10
autostart = true
autorestart = true
startsecs = 2
startretries = 5
stopsignal = TERM
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = /usr/sbin/nginx -g "daemon off;"
priority = 20
autostart = true
autorestart = true
startsecs = 2
startretries = 5
stopsignal = QUIT
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
