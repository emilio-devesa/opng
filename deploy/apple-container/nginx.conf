# Open Pastebin NG - Nginx for the Apple Container image (F3).
# Nginx listens on unprivileged 8080; PHP-FPM listens on 127.0.0.1:9000.
# Writable paths live on tmpfs so the root filesystem can be read-only.

user  www-data;
worker_processes  auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $uri $opng_referrer_policy {
        default                     strict-origin-when-cross-origin;
        /auth/reset_password.php    no-referrer;
    }
    log_format opng_access '$time_iso8601 $request_id $sent_http_x_request_id $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout opng_access;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Read-only-friendly temporary paths (entrypoint chowns them to www-data).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    client_max_body_size 4m;
    fastcgi_read_timeout 60s;

    server {
        listen 8080;
        server_name _;
        root /var/www/opng/src;
        index index.php;

        # Custom error documents (ROB-13): they render the shared layout and
        # the localized catalog without touching the database.
        error_page 404 /404.php;
        error_page 500 502 503 504 /500.php;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-OPNG-Trace $request_id always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy $opng_referrer_policy always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        # Enable OPNG_FORCE_HTTPS when a TLS proxy sits in front; HSTS is
        # ignored by browsers over plain HTTP.
        add_header Strict-Transport-Security "max-age=15768000" always;

        # Files that must only be loaded by PHP.
        location ~ ^/(config\.php|config\.example\.php|rules\.xml)$ {
            deny all;
            return 404;
        }
        location ^~ /includes/ {
            deny all;
            return 404;
        }
        location ^~ /classes/ {
            deny all;
            return 404;
        }
        location ~ /\.(?!well-known) {
            deny all;
            return 404;
        }
        location = /install.php {
            return 404;
        }
        location ~ ^/(tests|tools|database|deploy|docs)/ {
            deny all;
            return 404;
        }
        location ~* \.(md|lock|neon)$ {
            deny all;
            return 404;
        }

        # CAPTCHA images must never be cached.
        location = /auth/captcha.php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS off;
            fastcgi_pass 127.0.0.1:9000;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy $opng_referrer_policy always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header Strict-Transport-Security "max-age=15768000" always;
        }

        # Upstream errors include the raw request line in Nginx's error log.
        # Keep status and trace ID in the sanitized access log for this route.
        location = /auth/reset_password.php {
            error_log /dev/null;
            error_page 500 502 503 504 = @reset_unavailable;
            fastcgi_hide_header Referrer-Policy;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/auth/reset_password.php;
            fastcgi_param HTTPS off;
            fastcgi_pass 127.0.0.1:9000;
        }

        location @reset_unavailable {
            return 503;
        }

        location ^~ /api/v1/ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/api/v1/index.php;
            fastcgi_param HTTPS off;
            fastcgi_pass 127.0.0.1:9000;
        }

        location / {
            try_files $uri $uri/ /404.php;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS off;
            fastcgi_pass 127.0.0.1:9000;
        }

        # Versioned assets can be cached aggressively.
        location ~* \.(css|js|json|png|jpe?g|gif|svg|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy $opng_referrer_policy always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header Strict-Transport-Security "max-age=15768000" always;
            try_files $uri =404;
        }
    }
}
