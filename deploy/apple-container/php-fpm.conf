; Open Pastebin NG - PHP-FPM pool for the Apple Container image (F3).
; The default www.conf pool is removed in the Containerfile so only [opng]
; listens on 127.0.0.1:9000. clear_env = no is required so config.php can read
; OPNG_DB_* and the other runtime environment variables.

[global]
error_log = /proc/self/fd/2
daemonize = no

[opng]
user = www-data
group = www-data
listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1

pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/1

; Never expose errors or credentials to visitors; logs go to the container
; stdout/stderr so `container logs` shows them.
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
php_admin_value[display_errors] = off
php_admin_value[expose_php] = off

php_admin_value[session.save_path] = /var/lib/php/sessions
php_admin_value[post_max_size] = 4M
php_admin_value[upload_max_filesize] = 1M

; The application does not need file uploads or progress bars.
php_admin_flag[session.upload_progress.enabled] = off
php_admin_flag[allow_url_include] = off
