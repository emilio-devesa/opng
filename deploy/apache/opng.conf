# Open Pastebin NG - Apache 2.4 virtual host (F2)
# ------------------------------------------------------------------
# Adjust ServerName, the document root and the PHP-FPM socket. The root must
# be the extracted `src/` directory, never the package root.
#
#     a2enmod rewrite headers deflate expires proxy_fcgi setenvif
#     a2ensite opng
#     apachectl configtest && systemctl reload apache2
#
# Enable the TLS block only after a certificate is installed. The HTTP block
# redirects to HTTPS; remove the redirect for a local HTTP-only installation
# and do not send HSTS over plain HTTP.
# ------------------------------------------------------------------

<VirtualHost *:80>
    ServerName paste.example.com
    Redirect permanent / https://paste.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName paste.example.com

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/paste.example.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/paste.example.com/privkey.pem

    DocumentRoot /var/www/opng/src

    <Directory /var/www/opng/src>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php

        # The application accepts 1 MiB of paste text; form encoding expands it.
        LimitRequestBody 4194304
    </Directory>

    # Defence in depth when AllowOverride is disabled by the hosting panel.
    <FilesMatch "^(config\.php|config\.example\.php|database\.php|rules\.xml|composer\.(json|lock)|phpstan\.neon)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "\.(md|dist|log)$">
        Require all denied
    </FilesMatch>

    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteRule ^includes(?:/|$) - [R=404,L]
        RewriteRule ^(?:tests|tools|database|deploy|docs)(?:/|$) - [R=404,L]
        RewriteRule ^install\.php$ - [R=404,L]
        RewriteRule ^\. - [R=404,L]
    </IfModule>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
        # HSTS is only sent over TLS; adjust max-age after verifying every
        # subdomain is HTTPS-only.
        Header always set Strict-Transport-Security "max-age=15768000" env=HTTPS

        <FilesMatch "\.(css|js|json|png|jpe?g|gif|svg|ico|woff2?)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>
    </IfModule>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript
        AddOutputFilterByType DEFLATE application/javascript application/json image/svg+xml
    </IfModule>

    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css "access plus 1 year"
        ExpiresByType application/javascript "access plus 1 year"
        ExpiresByType image/svg+xml "access plus 1 year"
    </IfModule>

    # PHP-FPM via proxy_fcgi. Replace the socket with the one from your PHP
    # version (for example php8.3-fpm.sock).
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/opng-error.log
    CustomLog ${APACHE_LOG_DIR}/opng-access.log combined
</VirtualHost>
