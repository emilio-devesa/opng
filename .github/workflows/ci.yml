name: CI

on:
  push:
    branches: [main, master, v0.8-development]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring, mysqli
          coverage: none

      - name: PHP syntax check
        run: find src tools -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Password reset security regression test
        run: php tests/password_reset_security_test.php

      - name: Input limits regression test
        run: php tests/input_validation_test.php

      - name: Session and CSRF regression test
        run: php tests/session_security_test.php

      - name: Frontend contract and translation regression test
        run: php tests/frontend_contract_test.php

  phpstan:
    name: PHPStan (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring, mysqli
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan (level 5)
        run: composer phpstan

  database-install:
    name: MySQL Linux installation and privilege test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Prepare isolated legacy schema and database users
        run: |
          mysql --protocol=TCP -h 127.0.0.1 -uroot -pci-root-password <<'SQL'
          CREATE DATABASE opng_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE USER 'opng_runtime'@'%' IDENTIFIED BY 'runtime-ci-password';
          GRANT SELECT, INSERT, UPDATE, DELETE ON opng_ci.* TO 'opng_runtime'@'%';
          CREATE USER 'opng_migrator'@'%' IDENTIFIED BY 'migrator-ci-password';
          GRANT SELECT, INSERT, CREATE, ALTER, INDEX, DROP ON opng_ci.* TO 'opng_migrator'@'%';

          USE opng_ci;
          CREATE TABLE Users (
              ID INT AUTO_INCREMENT PRIMARY KEY,
              Username VARCHAR(50) UNIQUE NOT NULL,
              Email VARCHAR(100) UNIQUE NOT NULL,
              Password_hash VARCHAR(255) NOT NULL,
              Created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              role ENUM('admin', 'user') NOT NULL DEFAULT 'user',
              reset_token VARCHAR(255) NULL,
              reset_token_expires DATETIME NULL
          ) CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE TABLE Entries (
              ID VARCHAR(255) PRIMARY KEY,
              user_id INT,
              Date DATETIME DEFAULT CURRENT_TIMESTAMP,
              Language VARCHAR(20),
              Text TEXT,
              Topic TEXT
          ) CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE TABLE rate_limits (
              action VARCHAR(32) NOT NULL,
              key_hash CHAR(64) NOT NULL,
              window_start INT UNSIGNED NOT NULL,
              hits INT UNSIGNED NOT NULL DEFAULT 0,
              PRIMARY KEY (action, key_hash),
              KEY idx_rate_window (window_start)
          ) CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          INSERT INTO Users (Username, Email, Password_hash) VALUES ('legacy', 'legacy@example.test', 'hash');
          INSERT INTO Entries (ID, Language, Text, Topic) VALUES ('legacy', 'text', 'legacy text', 'legacy topic');
          SQL

      - name: Run CLI installer with migration-only credentials
        env:
          OPNG_DB_HOST: 127.0.0.1
          OPNG_DB_USER: opng_runtime
          OPNG_DB_PASS: runtime-ci-password
          OPNG_DB_NAME: opng_ci
          OPNG_INSTALL_DB_HOST: 127.0.0.1
          OPNG_INSTALL_DB_USER: opng_migrator
          OPNG_INSTALL_DB_PASS: migrator-ci-password
        run: |
          cp src/config.example.php src/config.php
          php src/install.php

      - name: Verify lowercase schema, preserved data, and runtime privileges
        env:
          OPNG_DB_HOST: 127.0.0.1
          OPNG_DB_USER: opng_runtime
          OPNG_DB_PASS: runtime-ci-password
          OPNG_DB_NAME: opng_ci
        run: php tests/database_install_test.php

      - name: Verify ambiguous case variants abort without changing data
        env:
          OPNG_DB_HOST: 127.0.0.1
          OPNG_DB_USER: opng_runtime
          OPNG_DB_PASS: runtime-ci-password
          OPNG_DB_NAME: opng_ambiguous
          OPNG_INSTALL_DB_HOST: 127.0.0.1
          OPNG_INSTALL_DB_USER: opng_migrator
          OPNG_INSTALL_DB_PASS: migrator-ci-password
        run: |
          mysql --protocol=TCP -h 127.0.0.1 -uroot -pci-root-password <<'SQL'
          CREATE DATABASE opng_ambiguous CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          GRANT SELECT, INSERT, UPDATE, DELETE ON opng_ambiguous.* TO 'opng_runtime'@'%';
          GRANT SELECT, INSERT, CREATE, ALTER, INDEX, DROP ON opng_ambiguous.* TO 'opng_migrator'@'%';
          USE opng_ambiguous;
          CREATE TABLE Entries (id INT PRIMARY KEY);
          CREATE TABLE entries (id INT PRIMARY KEY);
          INSERT INTO Entries VALUES (1);
          INSERT INTO entries VALUES (2);
          SQL

          if php src/install.php; then
            echo "Installer unexpectedly accepted ambiguous table names"
            exit 1
          fi

          test "$(mysql --protocol=TCP -h 127.0.0.1 -uroot -pci-root-password --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA = 'opng_ambiguous' AND TABLE_NAME IN ('Entries', 'entries')")" = "2"
          test "$(mysql --protocol=TCP -h 127.0.0.1 -uroot -pci-root-password --batch --skip-column-names -e "SELECT COUNT(*) FROM opng_ambiguous.Entries WHERE id = 1")" = "1"
          test "$(mysql --protocol=TCP -h 127.0.0.1 -uroot -pci-root-password --batch --skip-column-names -e "SELECT COUNT(*) FROM opng_ambiguous.entries WHERE id = 2")" = "1"
