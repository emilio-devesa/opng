name: Container image

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'deploy/apple-container/**'
      - 'src/**'
      - 'database/**'
      - 'tools/**'
      - '.github/workflows/container.yml'
  pull_request:
    paths:
      - 'deploy/apple-container/**'
      - 'src/**'
      - 'database/**'
      - 'tools/**'
      - '.github/workflows/container.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  arm64:
    name: Build arm64 image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/opng
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/apple-container/Containerfile
          platforms: linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the arm64 digest
        run: |
          echo "Built ghcr.io/${{ github.repository_owner }}/opng for linux/arm64."
          echo "On Apple silicon, create a portable archive with:"
          echo "  container image save ghcr.io/${{ github.repository_owner }}/opng:${{ github.ref_name }} opng-app-${{ github.ref_name }}-arm64.tar"
